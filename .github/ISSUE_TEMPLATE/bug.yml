name: Bug report
description: Report a capture, audio, export, sharing or startup problem.
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Error message and expected behavior. Do not attach private clips or tokens.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Windows version, GPU and driver, game and window mode, MonoClip version, capture settings.
    validations:
      required: true
