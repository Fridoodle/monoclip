name: Windows build and tests
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Core tests
        run: dotnet run --project tests/MonoClip.Tests
      - name: UI tests (no audible cue)
        run: dotnet run --project tests/MonoClip.UiTests
      - name: Hotkey fallback and deduplication
        run: dotnet run --project tests/MonoClip.UiTests -p:HotkeyTestStartup=HotkeyFallbackTests
      - name: Build Windows app
        run: dotnet build src/MonoClip.Windows -c Release -warnaserror
  portable:
    runs-on: windows-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Bundle official OBS runtime (pinned SHA256)
        run: python tools/prepare-runtime.py
      - name: Publish self-contained app
        run: dotnet publish src/MonoClip.Windows -c Release -r win-x64 --self-contained true -p:PublishReadyToRun=true -o dist/MonoClip
      - name: All libobs imports resolve in the bundled DLL
        shell: pwsh
        run: |
          dotnet build tests/MonoClip.NativeTests -c Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & tests/MonoClip.NativeTests/bin/Release/net10.0-windows/MonoClip.NativeTests.exe --exports
          exit $LASTEXITCODE
      - name: Build portable ZIP
        run: python tools/package-portable.py --app dist/MonoClip
      - name: Portable ZIP starts without setup or admin rights
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist/MonoClip-*-win-x64-portable.zip | Select-Object -First 1
          $target = Join-Path $env:RUNNER_TEMP 'Mono Clip (portable) test'
          Expand-Archive $zip.FullName $target
          $root = Join-Path $target 'MonoClip'
          foreach ($f in 'MonoClip.exe','obs.dll','obs-ffmpeg-mux.exe','runtime/data/libobs/default.effect','runtime/obs-plugins/64bit/win-capture.dll') {
            if (!(Test-Path (Join-Path $root $f))) { throw "missing $f" }
          }
          if (Get-ChildItem $root -Recurse -Include *.ps1,*.cmd) { throw 'setup scripts must not be shipped' }
          # Fresh settings start tray-only; the process must stay alive (no missing DLL / runtime error dialog).
          $p = Start-Process (Join-Path $root 'MonoClip.exe') -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "MonoClip exited early with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          $errors = Join-Path $env:LOCALAPPDATA 'MonoClip/errors.log'
          if (Test-Path $errors) { Get-Content $errors; throw 'MonoClip logged a startup error' }
      - uses: actions/upload-artifact@v4
        with:
          name: MonoClip-portable
          path: |
            dist/MonoClip-*-win-x64-portable.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
  release:
    # Tag push (e.g. v0.1.5): publish the single portable ZIP plus the official OBS source archive.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: portable
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: MonoClip-portable
          path: dist
      - name: Fetch corresponding OBS source (GPL)
        run: curl -fsSL -o dist/OBS-Studio-32.2.2-Sources.tar.gz https://github.com/obsproject/obs-studio/releases/download/32.2.2/OBS-Studio-32.2.2-Sources.tar.gz
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          zip="dist/MonoClip-${version}-win-x64-portable.zip"
          test -f "$zip" || { echo "Tag $GITHUB_REF_NAME does not match <Version> in MonoClip.Windows.csproj"; exit 1; }
          notes=$(awk -v v="## ${version}" 'index($0,v)==1{f=1;next} /^## /{f=0} f' CHANGELOG.md)
          printf '%s\n\n**Download:** `MonoClip-%s-win-x64-portable.zip` – entpacken, `MonoClip.exe` starten. Keine Installation, kein zweiter Download, keine Adminrechte.\n' "$notes" "$version" > notes.md
          gh release create "$GITHUB_REF_NAME" "$zip" dist/SHA256SUMS.txt dist/OBS-Studio-32.2.2-Sources.tar.gz --title "MonoClip ${version} Beta" --notes-file notes.md --prerelease
