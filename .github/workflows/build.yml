name: Windows build and tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Core tests
        run: dotnet run --project tests/MonoClip.Tests
      - name: UI tests (no audible cue)
        run: dotnet run --project tests/MonoClip.UiTests
      - name: Hotkey fallback and deduplication
        run: dotnet run --project tests/MonoClip.UiTests -p:HotkeyTestStartup=HotkeyFallbackTests
      - name: Build Windows app
        run: dotnet build src/MonoClip.Windows -c Release -warnaserror
